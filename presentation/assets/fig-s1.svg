<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 843" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-base" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b4a8a"/>
    </marker>
  </defs>

  <!-- BASE: settled state — full picture -->
  <g id="fs1-base">
    <rect x="0" y="0" width="720" height="843" fill="#2b1b3d"/>

    <!-- nodes -->
    <rect x="250" y="20" width="220" height="64" rx="14" fill="#3d2554" stroke="#6b4a8a" stroke-width="1.5"/>
    <rect x="250" y="130" width="220" height="64" rx="14" fill="#3d2554" stroke="#6b4a8a" stroke-width="1.5"/>
    <rect x="250" y="240" width="220" height="64" rx="14" fill="#3d2554" stroke="#6b4a8a" stroke-width="1.5"/>
    <rect x="250" y="350" width="220" height="64" rx="14" fill="#3d2554" stroke="#6b4a8a" stroke-width="1.5"/>
    <rect x="32" y="650" width="240" height="84" rx="14" fill="#3d2554" stroke="#6b4a8a" stroke-width="1.5"/>
    <rect x="448" y="650" width="240" height="84" rx="14" fill="#3d2554" stroke="#6b4a8a" stroke-width="1.5"/>

    <!-- diamond -->
    <polygon id="fs1-diamond-shape" points="360,446 510,520 360,594 210,520" fill="#3d2554" stroke="#6b4a8a" stroke-width="1.5"/>

    <!-- arrows (base) -->
    <line x1="360" y1="84" x2="360" y2="130" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>
    <line x1="360" y1="194" x2="360" y2="240" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>
    <line x1="360" y1="304" x2="360" y2="350" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>
    <line x1="360" y1="414" x2="360" y2="446" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>
    <line x1="285" y1="557" x2="152" y2="650" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>
    <line x1="435" y1="557" x2="568" y2="650" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>
    <path d="M 32 692 L 14 692 L 14 52 L 250 52" fill="none" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>
    <path d="M 688 692 L 706 692 L 706 162 L 470 162" fill="none" stroke="#6b4a8a" stroke-width="2.5" marker-end="url(#arrow-base)"/>

    <!-- branch labels -->
    <text x="190" y="618" font-size="19" fill="#fdf3e7" text-anchor="middle">Да</text>
    <text x="530" y="618" font-size="19" fill="#fdf3e7" text-anchor="middle">Нет</text>

    <!-- node labels -->
    <text x="360" y="64" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle">Стартовый корпус</text>
    <text x="360" y="174" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle">Мутация входов</text>
    <text x="360" y="284" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle">Обёртка и цель</text>
    <text x="360" y="394" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle">Битмап покрытия</text>
    <text x="152" y="684" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle">Сохранить</text>
    <text x="152" y="714" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle">в корпус</text>
    <text x="568" y="700" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle">Отбросить вход</text>

    <!-- diamond text -->
    <text x="360" y="520" font-size="21" font-weight="700" fill="#fdf3e7" text-anchor="middle" dominant-baseline="middle">Новое покрытие?</text>
  </g>

  <!-- STATE LAYERS (default visibility = settled visibility) -->
  <!-- b1 accent: chain nodes -->
  <g id="fs1-chain-nodes">
    <rect x="247" y="17" width="226" height="70" rx="15" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <rect x="247" y="127" width="226" height="70" rx="15" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <rect x="247" y="237" width="226" height="70" rx="15" fill="none" stroke="#ff6b35" stroke-width="3"/>
  </g>
  <!-- b1 accent: chain arrows (drawn) -->
  <path id="fs1-chain-arrows" d="M 360 84 L 360 130 M 360 194 L 360 240" fill="none" stroke="#ff6b35" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
  <g id="fs1-chain-tips" fill="#ff6b35">
    <path d="M 355 122 L 360 130 L 365 122 z"/>
    <path d="M 355 232 L 360 240 L 365 232 z"/>
  </g>
  <!-- b2 accent: diamond -->
  <polygon id="fs1-dia-accent" points="360,443 513,520 360,597 207,520" fill="none" stroke="#ff2e88" stroke-width="3"/>
  <path id="fs1-diamond-branches" d="M 285 557 L 152 650 M 435 557 L 568 650" fill="none" stroke="#ff2e88" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
  <g id="fs1-diamond-tips" fill="#ff2e88">
    <path d="M 146 642 L 152 651 L 160 642 z"/>
    <path d="M 562 642 L 568 651 L 576 642 z"/>
  </g>
</svg>
