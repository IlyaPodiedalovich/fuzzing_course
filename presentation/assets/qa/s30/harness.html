<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1776 775" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow30-base" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b4a8a"/>
    </marker>
    <marker id="arrow30-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b35"/>
    </marker>
    <marker id="arrow30-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2e88"/>
    </marker>
  </defs>

  <!-- BASE: settled state -->
  <g id="fs30-base">
    <rect x="0" y="0" width="1776" height="775" fill="#2b1b3d"/>
    <line x1="287" y1="340" x2="329" y2="340" stroke="#6b4a8a" stroke-width="3" marker-end="url(#arrow30-base)"/>
    <line x1="577" y1="340" x2="619" y2="340" stroke="#6b4a8a" stroke-width="3" marker-end="url(#arrow30-base)"/>
    <line x1="867" y1="340" x2="909" y2="340" stroke="#6b4a8a" stroke-width="3" marker-end="url(#arrow30-base)"/>
    <line x1="1157" y1="340" x2="1199" y2="340" stroke="#6b4a8a" stroke-width="3" marker-end="url(#arrow30-base)"/>
    <line x1="1447" y1="340" x2="1489" y2="340" stroke="#6b4a8a" stroke-width="3" marker-end="url(#arrow30-base)"/>
    <g id="fs30-box-1">
      <rect x="43" y="240" width="240" height="200" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
      <circle cx="163" cy="292" r="20" fill="#2b1b3d" stroke="#6b4a8a" stroke-width="2"/>
      <text x="163" y="300" font-size="24" font-weight="700" fill="#fdf3e7" text-anchor="middle">1</text>
      <text x="163" y="352" font-size="28" font-weight="700" fill="#fdf3e7" text-anchor="middle">lizard</text>
      <text x="163" y="390" font-size="20" fill="#fdf3e7" text-anchor="middle">выбор функции</text>
      <text x="163" y="416" font-size="20" fill="#fdf3e7" text-anchor="middle">по CCN</text>
    </g>
    <g id="fs30-box-2">
      <rect x="333" y="240" width="240" height="200" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
      <circle cx="453" cy="292" r="20" fill="#2b1b3d" stroke="#6b4a8a" stroke-width="2"/>
      <text x="453" y="300" font-size="24" font-weight="700" fill="#fdf3e7" text-anchor="middle">2</text>
      <text x="453" y="352" font-size="28" font-weight="700" fill="#fdf3e7" text-anchor="middle">обёртка</text>
      <text x="453" y="390" font-size="20" fill="#fdf3e7" text-anchor="middle">fuzz_&lt;функция&gt;.c</text>
      <text x="453" y="416" font-size="20" fill="#fdf3e7" text-anchor="middle"> </text>
    </g>
    <g id="fs30-box-3">
      <rect x="623" y="240" width="240" height="200" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
      <circle cx="743" cy="292" r="20" fill="#2b1b3d" stroke="#6b4a8a" stroke-width="2"/>
      <text x="743" y="300" font-size="24" font-weight="700" fill="#fdf3e7" text-anchor="middle">3</text>
      <text x="743" y="352" font-size="28" font-weight="700" fill="#fdf3e7" text-anchor="middle">сборка</text>
      <text x="743" y="390" font-size="20" fill="#fdf3e7" text-anchor="middle">afl-clang-fast,</text>
      <text x="743" y="416" font-size="20" fill="#fdf3e7" text-anchor="middle">clang -fsanitize</text>
    </g>
    <g id="fs30-box-4">
      <rect x="913" y="240" width="240" height="200" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
      <circle cx="1033" cy="292" r="20" fill="#2b1b3d" stroke="#6b4a8a" stroke-width="2"/>
      <text x="1033" y="300" font-size="24" font-weight="700" fill="#fdf3e7" text-anchor="middle">4</text>
      <text x="1033" y="352" font-size="28" font-weight="700" fill="#fdf3e7" text-anchor="middle">корпус</text>
      <text x="1033" y="390" font-size="20" fill="#fdf3e7" text-anchor="middle">3 сида,</text>
      <text x="1033" y="416" font-size="20" fill="#fdf3e7" text-anchor="middle">1–2 файла</text>
    </g>
    <g id="fs30-box-5">
      <rect x="1203" y="240" width="240" height="200" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
      <circle cx="1323" cy="292" r="20" fill="#2b1b3d" stroke="#6b4a8a" stroke-width="2"/>
      <text x="1323" y="300" font-size="24" font-weight="700" fill="#fdf3e7" text-anchor="middle">5</text>
      <text x="1323" y="352" font-size="28" font-weight="700" fill="#fdf3e7" text-anchor="middle">прогон</text>
      <text x="1323" y="390" font-size="20" fill="#fdf3e7" text-anchor="middle">AFL и libFuzzer</text>
      <text x="1323" y="416" font-size="20" fill="#fdf3e7" text-anchor="middle"> </text>
    </g>
    <g id="fs30-box-6">
      <rect x="1493" y="240" width="240" height="200" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
      <circle cx="1613" cy="292" r="20" fill="#2b1b3d" stroke="#6b4a8a" stroke-width="2"/>
      <text x="1613" y="300" font-size="24" font-weight="700" fill="#fdf3e7" text-anchor="middle">6</text>
      <text x="1613" y="352" font-size="28" font-weight="700" fill="#fdf3e7" text-anchor="middle">покрытие</text>
      <text x="1613" y="390" font-size="20" fill="#fdf3e7" text-anchor="middle">edges, cov,</text>
      <text x="1613" y="416" font-size="20" fill="#fdf3e7" text-anchor="middle">llvm-cov, coverage.py</text>
    </g>
  </g>

  <!-- STATE LAYERS -->
  <!-- b1: steps 1-3 (orange) -->
  <g id="fs30-chain1-nodes" fill="none" stroke="#ff6b35" stroke-width="3.5">
    <rect x="40" y="237" width="246" height="206" rx="17"/>
    <rect x="330" y="237" width="246" height="206" rx="17"/>
    <rect x="620" y="237" width="246" height="206" rx="17"/>
  </g>
  <path id="fs30-chain1-arrows" d="M 287 340 L 329 340 M 577 340 L 619 340" fill="none" stroke="#ff6b35" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
  <!-- b2: steps 4-6 (rose) -->
  <g id="fs30-chain2-nodes" fill="none" stroke="#ff2e88" stroke-width="3.5">
    <rect x="910" y="237" width="246" height="206" rx="17"/>
    <rect x="1200" y="237" width="246" height="206" rx="17"/>
    <rect x="1490" y="237" width="246" height="206" rx="17"/>
  </g>
  <path id="fs30-chain2-arrows" d="M 1157 340 L 1199 340 M 1447 340 L 1489 340" fill="none" stroke="#ff2e88" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
  <g id="fs30-chain1-tips" fill="#ff6b35">
    <path d="M 329 340 L 320 334 L 320 346 z"/>
    <path d="M 619 340 L 610 334 L 610 346 z"/>
  </g>
  <g id="fs30-chain2-tips" fill="#ff2e88">
    <path d="M 1199 340 L 1190 334 L 1190 346 z"/>
    <path d="M 1489 340 L 1480 334 L 1480 346 z"/>
  </g>
</svg>
<script src="gsap.min.js"></script>
<script src="fig.tl.js"></script>
<script>
// deck-animation capture harness: pinned seek, loop-free (T-14 loop is deck-level).
(function () {
  var tl = window.FigTl(window.gsap);
  var q = new URLSearchParams(location.search);
  if (q.has("t")) {
    tl.progress(Math.max(0, Math.min(1, parseFloat(q.get("t")))));
  }
  window.__figtl = tl;
  document.title = "fig " + tl.duration().toFixed(2) + "s";
})();
</script>
</body>
</html>
