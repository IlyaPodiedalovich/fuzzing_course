<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1776 775" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow2-base" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b4a8a"/>
    </marker>
  </defs>

  <!-- BASE: settled state -->
  <g id="fs2-base">
    <rect x="0" y="0" width="1776" height="775" fill="#2b1b3d"/>

    <!-- boxes -->
    <rect x="508" y="100" width="760" height="140" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
    <rect x="508" y="330" width="760" height="140" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>
    <rect x="508" y="560" width="760" height="140" rx="16" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/>

    <!-- arrows (base) -->
    <line x1="888" y1="330" x2="888" y2="240" stroke="#6b4a8a" stroke-width="3" marker-end="url(#arrow2-base)"/>
    <line x1="888" y1="560" x2="888" y2="470" stroke="#6b4a8a" stroke-width="3" marker-end="url(#arrow2-base)"/>

    <!-- box labels -->
    <text x="888" y="152" font-size="36" font-weight="700" fill="#fdf3e7" text-anchor="middle">Фаззер</text>
    <text x="888" y="190" font-size="21" fill="#fdf3e7" text-anchor="middle">afl-fuzz · libFuzzer · atheris</text>
    <text x="888" y="217" font-size="21" fill="#fdf3e7" text-anchor="middle">мутирует входы · оценивает покрытие · сохраняет корпус</text>

    <text x="888" y="382" font-size="34" font-weight="700" fill="#fdf3e7" text-anchor="middle">Обёртка (harness)</text>
    <text x="888" y="420" font-size="21" fill="#fdf3e7" text-anchor="middle">сырые байты в форму, ожидаемую целью</text>
    <text x="888" y="447" font-size="21" fill="#fdf3e7" text-anchor="middle">файл, структура или аргументы</text>

    <text x="888" y="612" font-size="34" font-weight="700" fill="#fdf3e7" text-anchor="middle">Компилятор и флаги</text>
    <text x="888" y="650" font-size="20" fill="#fdf3e7" text-anchor="middle">clang -fsanitize=fuzzer,address · afl-clang-fast</text>
    <text x="888" y="677" font-size="21" fill="#fdf3e7" text-anchor="middle">инструментация и санитайзер встраиваются при сборке</text>

    <!-- annotations (leader lines only; texts live in accent layers) -->
    <line x1="440" y1="630" x2="508" y2="630" stroke="#6b4a8a" stroke-width="2.5"/>
    <line x1="1268" y1="168" x2="1330" y2="168" stroke="#6b4a8a" stroke-width="2.5"/>
  </g>

  <!-- STATE LAYERS (settled-visible) -->
  <!-- b1: bottom box accent + left annotation (orange) -->
  <g id="fs2-bottom">
    <rect x="505" y="557" width="766" height="146" rx="17" fill="none" stroke="#ff6b35" stroke-width="3.5"/>
    <text x="60" y="608" font-size="28" font-weight="700" fill="#ff6b35" text-anchor="start">инструментация</text>
    <text x="60" y="648" font-size="28" font-weight="700" fill="#ff6b35" text-anchor="start">при сборке</text>
  </g>
  <!-- b2: middle box accent + arrows + right annotation (rose) -->
  <rect id="fs2-middle-rect" x="505" y="327" width="766" height="146" rx="17" fill="none" stroke="#ff2e88" stroke-width="3.5"/>
  <path id="fs2-arrows" d="M 888 560 L 888 470 M 888 330 L 888 240" fill="none" stroke="#ff2e88" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
  <g id="fs2-middle-tips" fill="#ff2e88">
    <path d="M 882 478 L 888 470 L 894 478 z"/>
    <path d="M 882 248 L 888 240 L 894 248 z"/>
  </g>
  <text id="fs2-right-note" x="1330" y="176" font-size="28" font-weight="700" fill="#ff2e88" text-anchor="start">исполнение</text>
</svg>
