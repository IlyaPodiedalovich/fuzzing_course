  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: formula
    text: |
      clang -fprofile-instr-generate -fcoverage-mapping -fsanitize=fuzzer,address -g -O1 -DHAVE_CONFIG_H -I$SRC/src -I$SRC fuzz_load_env.c env.c misc.c pw_dup.c -o cov_lf
      ./cov_lf cov_corpus -runs=3000
      llvm-cov report ./cov_lf -instr-profile=default.profdata
  - id: a1
    type: text
    text: |
      Профиль собирается через llvm-profdata merge -sparse default.profraw -o default.profdata.
      Измерено на 3000 прогонах: TOTAL 465 regions 19.78%, 582 lines 20.10%, 322 branches 20.81%;
      обёртка 93.33% строк, env.c 40.19%.
  figure:
    kind: chart
    prompt: |
      Горизонтальная столбчатая диаграмма покрытия строк, портретный холст 800 на 900, шкала 0 до 100%:
      «обёртка (файл)» 93.33%, «env.c» 40.19%, «TOTAL (все файлы)» 20.10%.
      Столбцы оранжевые #ff6b35, у каждого столбца подпись значения справа.
      Ось с делениями 0, 50, 100. Подписи имён слева от оси.
      Стили: фон #2b1b3d, ось и деления #6b4a8a, подписи #fdf3e7.
    caption: "Покрытие строк: обёртка, env.c, весь проект"
  anim:
    duration: 5.42
    beats:
    - id: b0
      pose: |
        холодный кадр: ось с делениями и три имени файлов приглушены, столбцов нет
      change: приглушённые оси и подписи проявляются из фона
    - id: b1
      pose: |
        столбец «обёртка (файл)» вырос до 93.33%, значение видно
      change: первый столбец растёт от оси
      accent: столбец обёртки
    - id: b2
      pose: |
        столбцы «env.c» 40.19% и «TOTAL (все файлы)» 20.10% выросли, значения видны
      change: два нижних столбца растут от оси
      accent: столбец TOTAL
    settled: |
      три столбца с значениями 93.33%, 40.19%, 20.10% и ось 0 до 100
  notes: |
    Обёртка покрыта хорошо, целевая логика покрыта слабо, и это сигнал продолжать фаззинг.

