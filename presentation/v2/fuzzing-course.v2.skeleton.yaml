skeleton_version: 1
meta:
  title: "Курс по фаззингу: AFL, libFuzzer, Atheris"
  audience: "Коллега, знающий C и Python"
  lang: ru
  target: html
  canvas: "16:9"
  design_ref: "../design.md"
  tone: academic
  anim_role: factual
  source: "../../course.md"

slides:

- id: t
  title: "Курс по фаззингу"
  layout: section
  caption: "AFL · libFuzzer · Atheris: полный цикл, от выбора функции до покрытия"
  blocks:
  - id: a0
    type: text
    text: |
      AFL · libFuzzer · Atheris: полный цикл, от выбора функции до покрытия
  anim:
    duration: 4
    beats:
    - id: b0
      pose: |
        cold base: empty canvas
      change: title panel rises in
    - id: b1
      pose: |
        full title: «Курс по фаззингу» и подзаголовок
      change: title and subtitle settle
    settled: |
      title panel centered, subtitle below it, canvas dark
  notes: |
    Открывать: 60 минут теории, затем самостоятельная практика.
    Фаззинг является автоматизированным тестированием, которое находит сбои программы.

- id: sec-model
  title: "Модель и выбор цели"
  layout: section
  caption: "Общая идея · lizard · критерии выбора"
  blocks:
  - id: a0
    type: text
    text: |
      Общая идея · lizard · критерии выбора
  anim:
    duration: 3
    beats:
    - id: b0
      pose: |
        cold base: dim section title
      change: title fades in
    - id: b1
      pose: |
        full section title and caption line
      change: caption appears
    settled: |
      centered section title with caption, dark canvas
  notes: |
    От общей модели к выбору функции. Первый вопрос: что именно делает фаззер.

- id: s1
  title: "Coverage-guided: цикл обратной связи"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      Coverage-guided фаззинг это автоматизированное тестирование: инструмент генерирует
      входы, подаёт их в цель и сохраняет только те, что открывают новое покрытие,
      то есть новое ребро графа управления потоком.
  - id: a1
    type: bullet
    text: |
      Инструментация встраивается компилятором при сборке; без неё фаззер не видит путь выполнения
      Сбои находятся как аномалии: исключения, нарушения памяти, таймауты
      Цель фаззера не доказать корректность, а найти несоответствие ожидаемого и фактического поведения
  figure:
    kind: diagram
    prompt: |
      Замкнутый цикл coverage-guided фаззинга, портретный холст 800 на 900, узлы сверху вниз,
      цепочка замыкается боковыми возвратными линиями:
      (1) прямоугольник «Стартовый корпус»;
      (2) «Мутация входов»;
      (3) «Обёртка: цель под инструментацией»;
      (4) «Битмап покрытия»;
      (5) ромб «Новое покрытие?» с двумя ветвями: левая подписана «Да» и ведёт в (6) «Сохранить в корпус»,
      правая подписана «Нет» и ведёт в (7) «Отбросить вход»;
      от (6) левая возвратная линия идёт вверх в узел (1), от (7) правая возвратная линия идёт вверх в узел (2).
      Стили: фон #2b1b3d, контур блоков #6b4a8a, подписи #fdf3e7, акценты #ff6b35 и #ff2e88;
      стрелки нарисованы геометрически, направление читается по наконечникам; подписи не наезжают на линии.
    caption: "Цикл обратной связи"
  anim:
    duration: 6.35
    beats:
    - id: b0
      pose: |
        холодный кадр: контур фигуры отсутствует, видны только фон и подпись слайда
      change: приглушённый каркас цикла проявляется из фона
    - id: b1
      pose: |
        узлы (1) «Стартовый корпус», (2) «Мутация входов», (3) «Обёртка: цель под инструментацией»
        и стрелки между ними ярко выделены; остальные узлы приглушены, обе ветви ромба не проведены
      change: узлы 1, 2, 3 и две стрелки между ними выходят на полную яркость
      accent: путь от (1) до (3)
    - id: b2
      pose: |
        ромб «Новое покрытие?» и обе ветви проведены: «Да» в «Сохранить в корпус», «Нет» в «Отбросить вход»;
        оба возвратных ребра ведут обратно в (1) и в (2); все восемь элементов на полной яркости
      change: ромб, обе ветви, два нижних блока и два возвратных ребра появляются
      accent: ромб и ветвь «Да»
    settled: |
      полный цикл: четыре узла, ромб, два исхода, две возвратных линии, все подписи;
      подпись рисунка «Цикл обратной связи»
  notes: |
    Фаззер не знает ничего, кроме битмапа и входов. Корпус растёт только за счёт
    новых путей выполнения.

- id: s2
  title: "Три уровня инструмента"
  layout: diagram
  title_fx: fade-up
  figure:
    kind: diagram
    prompt: |
      Стопка из трёх горизонтальных блоков, нижний блок на холсте ниже остальных, ширина 1600 на 640:
      верхний блок «Фаззер: afl-fuzz, libFuzzer, atheris» с подписью «мутирует входы, оценивает покрытие, сохраняет корпус»;
      средний «Обёртка (harness)» с подписью «сырые байты становятся формой, которую ждёт цель»;
      нижний «Компилятор и флаги» с подписью «clang -fsanitize=fuzzer,address; afl-clang-fast».
      Две вертикальные стрелки снизу вверх: от нижнего блока к среднему, от среднего к верхнему.
      Слева пояснение «инструментация при сборке» с выноской к нижнему блоку, справа «исполнение» с выноской к верхнему.
      Стили: фон #2b1b3d, контур #6b4a8a, подписи #fdf3e7, акцент #ff6b35.
    caption: "Три слоя: компилятор, обёртка и фаззер"
  anim:
    duration: 4.73
    beats:
    - id: b0
      pose: |
        холодный кадр: блоки отсутствуют, виден только фон
      change: приглушённая стопка проявляется из фона
    - id: b1
      pose: |
        нижний блок «Компилятор и флаги» на полной яркости, слева видна выноска «инструментация при сборке»
      change: нижний блок и его выноска выходят на полную яркость
      accent: «Компилятор и флаги»
    - id: b2
      pose: |
        средний блок «Обёртка (harness)» и верхний «Фаззер» на полной яркости, обе вертикальные стрелки проведены,
        справа видна выноска «исполнение»
      change: средний блок, верхний блок, две стрелки и правая выноска появляются
      accent: «Обёртка»
    settled: |
      все три блока с подписями, обе стрелки, обе боковые выноски; подпись рисунка «Три слоя»
  notes: |
    Компилятор отвечает за покрытие, обёртка отвечает за форму входа,
    фаззер отвечает за цикл. Без инструментации фаззер не видит путь выполнения.

- id: s3
  title: "lizard: метрики и отчёт"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      lizard это статический анализатор: считает метрики без заголовков, сборки и запуска.
      CCN означает число линейно независимых путей в функции; это эвристический индикатор, а не гарантия.
  - id: a1
    type: bullet
    text: |
      NLOC: непустые строки кода без комментариев
      CCN: число линейно независимых путей
      token: количество токенов в теле функции
      PARAM: количество параметров
      length: размер функции в строках
      location: имя@строки@файл
  figure:
    kind: diagram
    prompt: |
      Граф управления потоком по Маккейбу, портретный холст 800 на 900, шесть узлов с номерами:
      узел 1 вход вверху по центру, из него два ребра вниз в узлы 2 (слева) и 3 (справа);
      из 2 ребро в 4, из 3 ребро в 5; из 4 и из 5 рёбра сходятся в узел 6 выход внизу.
      Поверх рёбер нарисованы два пути: путь P1 проходит узлы 1, 2, 4, 6 и выделен оранжевым #ff6b35,
      путь P2 проходит узлы 1, 3, 5, 6 и выделен розовым #ff2e88.
      Под графом пилюля с надписью «CCN = 2». Узлы это круги с номером внутри, путь проходит под кругами.
      Стили: фон #2b1b3d, контур узлов #6b4a8a, подписи #fdf3e7.
    caption: "Два независимых пути в графе: CCN = 2"
  anim:
    duration: 5.75
    beats:
    - id: b0
      pose: |
        холодный кадр: шесть узлов с номерами и пять рёбер графа видны приглушённо, пути не нарисованы, пилюли CCN нет
      change: приглушённый граф проявляется из фона
    - id: b1
      pose: |
        путь P1 (1, 2, 4, 6) прорисован оранжевым, рядом подпись «P1»; узел 6 достигнут
      change: путь P1 прорисовывается от узла 1 к узлу 6
      accent: путь P1
    - id: b2
      pose: |
        путь P2 (1, 3, 5, 6) прорисован розовым, рядом подпись «P2», внизу пилюля «CCN = 2»
      change: путь P2 прорисовывается, пилюля CCN появляется
      accent: путь P2 и пилюля CCN
    settled: |
      граф из шести узлов, два независимых пути, подписи P1 и P2, пилюля «CCN = 2»
  notes: |
    Два линейно независимых пути означают CCN 2. Для load_env lizard показывает CCN 31:
    столько путей нужно пройти, чтобы накрыть функцию целиком.

- id: s4
  title: "lizard: запуск и ключи"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: formula
    text: |
      lizard /opt/fuzzenv/src/cronie-1.5.7/src/*.c
  - id: a1
    type: bullet
    text: |
      -C 20: warning, если CCN функции выше порога
      -s cyclomatic_complexity: сортировка по CCN
      -t 4: четыре параллельных воркера
      -w: только warnings, clang-style, для CI
      --csv, --xml, --html: машинный отчёт
      --compact: скрыть анонимные функции с CCN 1
  figure:
    kind: diagram
    prompt: |
      Конвейер из трёх шагов сверху вниз, портретный холст 800 на 900:
      шаг 1 блок «каталог: cronie-1.5.7/src/*.c» с подписью «lizard <dir> обходит каталог рекурсивно»;
      шаг 2 блок «lizard» с подписью «статический анализ, без сборки и запуска»;
      шаг 3 блок «таблица» с подписью «CCN и NLOC, сортировка по CCN».
      Между шагами вертикальные стрелки вниз. Ниже рамочная мини-таблица из трёх строк
      «load_env 31 88», «child_process 84 324», «cron_popen 27 88» с шапкой «функция CCN NLOC».
      Стили: фон #2b1b3d, контур #6b4a8a, подписи #fdf3e7, акцент #ff6b35 на шаге lizard.
    caption: "lizard: каталог, анализ, таблица CCN"
  anim:
    duration: 4.82
    beats:
    - id: b0
      pose: |
        холодный кадр: три блока конвейера приглушены, стрелки не проведены, таблицы нет
      change: приглушённый конвейер проявляется из фона
    - id: b1
      pose: |
        блок 1 «каталог: cronie-1.5.7/src/*.c» на полной яркости, его подпись видна
      change: блок 1 и его подпись выходят на полную яркость
      accent: блок 1
    - id: b2
      pose: |
        блок 2 «lizard» на полной яркости, стрелка от блока 1 к блоку 2 проведена
      change: блок 2, его подпись и первая стрелка появляются
      accent: блок 2
    - id: b3
      pose: |
        блок 3 «таблица» на полной яркости, вторая стрелка проведена, мини-таблица из трёх строк видна
      change: блок 3, вторая стрелка и мини-таблица появляются
      accent: мини-таблица
    settled: |
      три блока конвейера, две стрелки, мини-таблица «функция CCN NLOC» с тремя строками
  notes: |
    Те же ключи и та же таблица NLOC/CCN работают и для Python:
    lizard /opt/atheris-src/watcher/watcher/common/utils.py

- id: s5
  title: "Топ-8 функций cronie по CCN"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      Восемь самых сложных функций cronie 1.5.7 по версии lizard 1.26.1. Максимум у child_process,
      CCN 84. Наш выбор load_env с CCN 31 отмечен розовым: это не самая сложная функция списка.
  figure:
    kind: chart
    prompt: |
      Горизонтальная столбчатая диаграмма, портретный холст 800 на 900, восемь функций по убыванию CCN,
      ось значений 0 до 90 с делениями 0, 30, 60, 90:
      child_process 84, load_entry 67, parse_args 54, edit_cmd 52, main 50, load_env 31, cron_popen 27, load_user 25.
      Столбцы оранжевые #ff6b35, столбец load_env розовый #ff2e88 и подписан «выбор»;
      у столбца child_process подпись «отклонён». Имена функций слева от оси, значения справа от столбцов.
      Стили: фон #2b1b3d, ось и деления #6b4a8a, подписи #fdf3e7, значения #ff6b35.
    caption: "CCN восьми функций cronie 1.5.7 (lizard 1.26.1)"
  anim:
    duration: 6.63
    beats:
    - id: b0
      pose: |
        холодный кадр: ось с делениями и восемь имён функций приглушены, столбцов нет
      change: приглушённые оси и подписи проявляются из фона
    - id: b1
      pose: |
        четыре верхних столбца выросли до своих значений: child_process 84, load_entry 67, parse_args 54, edit_cmd 52
      change: первые четыре столбца растут от оси
      accent: столбец child_process с подписью «отклонён»
    - id: b2
      pose: |
        остальные четыре столбца выросли: main 50, load_env 31, cron_popen 27, load_user 25;
        столбец load_env розовый с подписью «выбор»
      change: четыре нижних столбца растут, появляются подписи «выбор» и «отклонён»
      accent: столбец load_env
    settled: |
      восемь столбцов с значениями, ось 0 до 90, подписи «выбор» у load_env и «отклонён» у child_process
  notes: |
    load_env не самая сложная функция списка, и это осознанный выбор:
    следующие слайды показывают критерии, которые важнее CCN.

- id: s6
  title: "Пять критериев выбора цели"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      CCN это только первый фильтр. Дальше цель проверяют по пяти критериям достижимости
      и воспроизводимости.
  - id: a1
    type: bullet
    text: |
      Вход это сырые байты, а не argv и не сокет
      Минимум побочных эффектов: без exec, файлов и сети
      Минимум линк-зависимостей: меньше .c-файлов
      Парсинг неструктурированного входа: источник багов памяти
      Не дубликат: load_entry уже покрыта
  figure:
    kind: diagram
    prompt: |
      Воронка из трёх ступеней сверху вниз, портретный холст 800 на 900:
      ступень 1 широкий блок «8 функций cronie» с подписью «CCN от 25 до 84»;
      ступень 2 блок «5 критериев выбора» с подписью «достижимость и воспроизводимость»;
      ступень 3 узкая пилюля «load_env: CCN 31» в розовом #ff2e88.
      Между ступенями вертикальные стрелки вниз, у первой стрелки слева подпись «CCN».
      Стили: фон #2b1b3d, контур #6b4a8a, подписи #fdf3e7, акцент оранжевый #ff6b35 на ступенях 1 и 2.
    caption: "От восьми функций к одной цели"
  anim:
    duration: 5.07
    beats:
    - id: b0
      pose: |
        холодный кадр: три ступени воронки приглушены, стрелки не проведены
      change: приглушённая воронка проявляется из фона
    - id: b1
      pose: |
        ступень 1 «8 функций cronie» и подпись «CCN от 25 до 84» на полной яркости
      change: ступень 1 и её подпись выходят на полную яркость
      accent: ступень 1
    - id: b2
      pose: |
        стрелка с подписью «CCN» проведена, ступень 2 «5 критериев выбора» на полной яркости
      change: стрелка, подпись «CCN» и ступень 2 появляются
      accent: ступень 2
    - id: b3
      pose: |
        вторая стрелка проведена, пилюля «load_env: CCN 31» розовая, воронка замкнута
      change: вторая стрелка и пилюля результата появляются
      accent: пилюля load_env
    settled: |
      три ступени, две стрелки, подпись «CCN», пилюля «load_env: CCN 31»
  notes: |
    CCN это первый фильтр. Затем идут достижимость и воспроизводимость.

- id: s7
  title: "Выбор: load_env, а не child_process"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      load_env находится в src/env.c:181: CCN 31, NLOC 88, конечный автомат для разбора строк
      окружения NAME=VALUE с кавычками, экранированием и таблицей состояний.
  - id: a1
    type: bullet
    text: |
      child_process: exec и записи файлов
      load_entry: уже покрыта
      parse_args: argv, а не байты
      edit_cmd: файлы и терминал
      main: точка входа
      cron_popen: popen()
      load_user: /etc/passwd
  figure:
    kind: diagram
    prompt: |
      Две панели сравнения рядом, портретный холст 800 на 900.
      Левая панель «child_process» с признаками «CCN 84», «spawn и exec», «записи файлов», внизу бейдж «отклонён».
      Правая панель «load_env» с признаками «CCN 31», «поток как FILE*», «без побочных эффектов»,
      «конечный автомат», внизу бейдж «выбор».
      В финале левая панель приглушена и перечёркнута крестом, правая обведена розовым #ff2e88.
      Стили: фон #2b1b3d, контур панелей #6b4a8a, подписи #fdf3e7, оранжевый #ff6b35 на признаках load_env.
    caption: "Два кандидата: child_process против load_env"
  anim:
    duration: 5.07
    beats:
    - id: b0
      pose: |
        холодный кадр: обе панели с заголовками и признаками приглушены, креста и розовой обводки нет
      change: приглушённые панели проявляются из фона
    - id: b1
      pose: |
