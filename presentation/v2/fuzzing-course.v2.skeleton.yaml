      pose: |
        холодный кадр: две панели с заголовками приглушены, стрелки не проведены
      change: приглушённые панели проявляются из фона
    - id: b1
      pose: |
        панель 1 «Стабы» на полной яркости, блоки «оригинальная цель» и «стаб» видны, стрелка проведена
      change: панель 1, её блоки и стрелка выходят на полную яркость
      accent: панель 1
    - id: b2
      pose: |
        панель 2 «Include-trick» на полной яркости, чип «#define main fuzz_original_main» и стрелка видны
