  notes: |
    Python-обёртки используют тот же lizard для выбора цели.

- id: s27
  title: "Atheris: структура и FuzzedDataProvider"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: formula
    text: |
      def TestOneInput(data):
          fdp = atheris.FuzzedDataProvider(data)
          mode = fdp.ConsumeIntInRange(0, 5)
          args = fdp.ConsumeBytes(...)
          target_function(mode, args)
  - id: a1
    type: text
    text: |
      Порядок вызовов Consume* фиксирован от итерации к итерации, иначе покрытие невоспроизводимо.
  figure:
    kind: diagram
    prompt: |
      Поток разбора байтов в Python, портретный холст 800 на 900:
      блок «сырые байты (data)»; стрелка вниз;
      блок «FuzzedDataProvider» с тремя чипами «ConsumeIntInRange(0, 5)», «ConsumeBytes(n)», «ConsumeFloat()»;
      стрелка вниз; блок «target_function(mode, args)».
      Стили: фон #2b1b3d, контур #6b4a8a, подписи #fdf3e7, акцент #ff2e88 на блоке FuzzedDataProvider.
    caption: "Байты, FuzzedDataProvider, аргументы цели"
  anim:
    duration: 5.16
    beats:
    - id: b0
      pose: |
