      change: приглушённый поток проявляется из фона
    - id: b1
      pose: |
        блок «сырые байты (data)» на полной яркости
      change: блок 1 выходит на полную яркость
      accent: блок 1
    - id: b2
      pose: |
        блок «FuzzedDataProvider» на полной яркости, три чипа методов видны, первая стрелка проведена
      change: блок 2, его чипы и первая стрелка появляются
