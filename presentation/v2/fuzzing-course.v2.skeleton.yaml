- id: s11
  title: "Каркас обёртки: AFL vs libFuzzer"
  layout: full
  title_fx: fade-up
  blocks:
  - id: a0
    type: formula
    text: |
      #ifdef __AFL_FUZZ_TESTCASE_BUF
      /* AFL: persistent mode через fork-сервер */
      int main(void) {
          __AFL_INIT();
          __AFL_FUZZ_INIT();
          const unsigned char *data = __AFL_FUZZ_TESTCASE_BUF;
          while (__AFL_LOOP(10000)) {
              size_t size = __AFL_FUZZ_TESTCASE_LEN;
              do_fuzz(data, size);
          }
          return 0;
      }
      #else
      /* libFuzzer: главный main генерирует clang'ом */
      int LLVMFuzzerTestOneInput(const uint8_t *data, size_t size) {
          do_fuzz(data, size);
          return 0;
      }
      #endif
  - id: a1
    type: text
    text: |
      __AFL_LOOP(10000) это persistent mode: на порядок быстрее, чем перезапуск
      процесса. Требует детерминированности: нет утечек, нет exit, нет глобального состояния.
  anim:
    duration: 3
    beats:
    - id: b0
      pose: |
        cold base: title visible
      change: title rises in
    - id: b1
      pose: |
        full slide: code block and one note line
      change: code appears, note appears
    settled: |
      full slide: title, code, note
  notes: |
    Один файл, один кодовый путь: #ifdef определяет, для какого фаззера собирается обёртка.

- id: s12
  title: "Приёмы 1–3: dispatch, fmemopen, структура"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      Dispatch-байт: первый байт выбирает режим, остальные служат данными для него.
  - id: a1
    type: text
    text: |
      fmemopen(): буфер фаззера превращают в FILE*, и цель читает обычный поток.
  - id: a2
    type: text
    text: |
      Структура: mode = data[0], n = (data[1] << 8) | data[2], payload = data + 3.
  figure:
    kind: diagram
    prompt: |
      Три горизонтальные панели сверху вниз, портретный холст 800 на 900.
      Панель 1 «Dispatch-байт» с подписью «первый байт выбирает один из пяти парсеров» и чипом «data[0] % 5»;
      панель 2 «fmemopen()» с подписью «буфер становится FILE* для цели» и чипами «буфер» и «FILE*»;
      панель 3 «Структура» с подписью «поля читаются по порядку» и схемой из трёх сегментов
      «mode», «n: uint16», «payload».
      Стили: фон #2b1b3d, контур панелей #6b4a8a, подписи #fdf3e7, акцент #ff6b35 на заголовках панелей.
    caption: "Три приёма: выбор режима, файл из буфера, разбор полей"
  anim:
    duration: 6.01
    beats:
    - id: b0
      pose: |
        холодный кадр: три панели с заголовками приглушены
      change: приглушённый каркас панелей проявляется из фона
    - id: b1
      pose: |
        панель 1 «Dispatch-байт» на полной яркости, чип «data[0] % 5» виден
      change: панель 1 и её чип выходят на полную яркость
      accent: панель 1
    - id: b2
      pose: |
        панель 2 «fmemopen()» на полной яркости, чипы «буфер» и «FILE*» видны
      change: панель 2 и её чипы выходят на полную яркость
      accent: панель 2
    - id: b3
      pose: |
        панель 3 «Структура» на полной яркости, схема «mode | n: uint16 | payload» видна
      change: панель 3 и схема полей выходят на полную яркость
      accent: панель 3
    settled: |
      три панели: dispatch-байт, fmemopen, структура полей
  notes: |
    Фиксируйте выбранный приём в комментарии к обёртке.

- id: s13
  title: "Приёмы 4 и 5: стабы и include-trick"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      Стабы: внешние зависимости чужой функции заменяют поддельными реализациями.
      В fuzz_slirp_input.c весь callback-интерфейс Slirp подменяют стабами; в Python это mock.patch.
  - id: a1
    type: text
    text: |
      Include-trick: статическая функция из чужого файла собирается через подмену main.
      #define main fuzz_original_main, затем #include "api.c" вместо заголовка.
  figure:
    kind: diagram
    prompt: |
      Две горизонтальные панели сверху вниз, портретный холст 800 на 900.
      Панель 1 «Стабы»: блок «оригинальная цель» и блок «стаб», между ними стрелка,
      подпись «наивная реализация без побочных эффектов».
      Панель 2 «Include-trick»: блок «api.c» с чипом «#define main fuzz_original_main»,
      стрелка к блоку «обёртка», подпись «#include "api.c" вместо заголовка».
      Стили: фон #2b1b3d, контур #6b4a8a, подписи #fdf3e7, акцент #ff2e88 на заголовках панелей.
    caption: "Две подмены: стаб зависимости и подмена main"
  anim:
    duration: 4.56
