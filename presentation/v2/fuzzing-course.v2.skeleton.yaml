- id: s26
  title: "Atheris: что это"
  layout: content-left
  title_fx: fade-up
  blocks:
  - id: a0
    type: text
    text: |
      Atheris это обёртка libFuzzer для Python: вход это сырые байты, главные функции
      atheris.Setup() и atheris.Fuzz(), сбой фиксируется как неперехваченное исключение.
  - id: a1
    type: bullet
    text: |
      Инструментация: байткод при импорте, без компиляции
      Покрытие строк: coverage.py
  figure:
    kind: diagram
    prompt: |
      Конвейер из трёх блоков сверху вниз, портретный холст 800 на 900:
      блок «байткод-инструментация» с подписью «при импорте, без компиляции»;
      блок «Atheris: цикл coverage-guided» с подписью «atheris.Setup и atheris.Fuzz»;
      блок «отчёт coverage.py» с подписью «строки, только при штатной остановке».
      Между блоками вертикальные стрелки вниз.
      Стили: фон #2b1b3d, контур #6b4a8a, подписи #fdf3e7, акцент #ff6b35 на среднем блоке.
    caption: "Три шага Atheris: инструментация, цикл, отчёт"
  anim:
    duration: 4.73
    beats:
    - id: b0
      pose: |
        холодный кадр: три блока приглушены, стрелок нет
      change: приглушённый конвейер проявляется из фона
    - id: b1
      pose: |
        блок «байткод-инструментация» на полной яркости
      change: блок 1 выходит на полную яркость
      accent: блок 1
    - id: b2
      pose: |
        блок «Atheris: цикл coverage-guided» на полной яркости, первая стрелка проведена
      change: блок 2 и первая стрелка появляются
      accent: блок 2
    - id: b3
      pose: |
        блок «отчёт coverage.py» на полной яркости, вторая стрелка проведена
      change: блок 3 и вторая стрелка появляются
      accent: блок 3
    settled: |
