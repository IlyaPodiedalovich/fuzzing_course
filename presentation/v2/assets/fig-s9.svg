<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" font-family="Montserrat, 'Century Gothic', sans-serif">
<rect x="0" y="0" width="800" height="900" fill="#2b1b3d"/>
<g id="fs9-all">
<g id="fs9-c1"><rect x="40" y="120" width="345" height="310" rx="18" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/><text x="66" y="196" font-size="54" font-weight="700" fill="#ff6b35" text-anchor="start">1</text><text x="66" y="250" font-size="26" font-weight="700" fill="#fdf3e7" text-anchor="start">Простота</text><text x="66" y="306" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">байты, форма,</text><text x="66" y="340" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">цель, ноль</text><text x="66" y="374" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">без логирования</text></g><g id="fs9-c2"><rect x="415" y="120" width="345" height="310" rx="18" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/><text x="441" y="196" font-size="54" font-weight="700" fill="#ff6b35" text-anchor="start">2</text><text x="441" y="250" font-size="26" font-weight="700" fill="#fdf3e7" text-anchor="start">Одна обёртка</text><text x="441" y="306" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">одна цель:</text><text x="441" y="340" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">один сценарий</text><text x="441" y="374" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">на файл</text></g><g id="fs9-c3"><rect x="40" y="470" width="345" height="310" rx="18" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/><text x="66" y="546" font-size="54" font-weight="700" fill="#ff6b35" text-anchor="start">3</text><text x="66" y="600" font-size="26" font-weight="700" fill="#fdf3e7" text-anchor="start">Детерминированность</text><text x="66" y="656" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">LineNumber = 0,</text><text x="66" y="690" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">без exit,</text><text x="66" y="724" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">файлов и сети</text></g><g id="fs9-c4"><rect x="415" y="470" width="345" height="310" rx="18" fill="#3d2554" stroke="#6b4a8a" stroke-width="2"/><text x="441" y="546" font-size="54" font-weight="700" fill="#ff6b35" text-anchor="start">4</text><text x="441" y="600" font-size="26" font-weight="700" fill="#fdf3e7" text-anchor="start">Проверки до вызова</text><text x="441" y="656" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">ранний возврат</text><text x="441" y="690" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">на пустом и</text><text x="441" y="724" font-size="24" font-weight="400" fill="#cbbcd6" text-anchor="start">большом входе</text></g>
</g>
</svg>
